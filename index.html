document.addEventListener("mousedown",e=>{if(e.target.closest("[data-act='fmt'],[data-act='c-link'],[data-act='c-emoji']"))e.preventDefault()});
function createLabelFromInput(){const inp=$("#ln-in");if(!inp)return;const v=inp.value.trim();if(!v){$("#label-new-slot").innerHTML="";return}const L=addLabel(v);renderSidebar();toast(`Label “${L.name}” created`,{icon:"tag",ms:2400})}
function toggleCheck(id){S.checked.has(id)?S.checked.delete(id):S.checked.add(id);renderList()}
document.addEventListener("change",e=>{const t=e.target;if(t.matches(".chk input")){toggleCheck(t.dataset.id)}});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;clearTimeout(window._qT);window._qT=setTimeout(()=>{renderSidebar();renderList(false)},120)}});
async function typeSummary(){const items=$$("#ai-card li");if(reduced)return;const texts=items.map(li=>li.textContent);items.forEach(li=>li.textContent="");for(let i=0;i<items.length;i++){const s=texts[i];for(let j=0;j<=s.length;j+=2){if(!items[i].isConnected)return;items[i].textContent=s.slice(0,j);await wait(9)}items[i].textContent=s}}

/* keyboard */
document.addEventListener("keydown",e=>{
  if(V){if(e.key==="Escape")closeViewer();if(e.key==="ArrowRight"&&V.list.length>1)vGo(V.i+1);if(e.key==="ArrowLeft"&&V.list.length>1)vGo(V.i-1);if(e.key==="+"||e.key==="=")zoom(1);if(e.key==="-")zoom(-1);return}
  if($(".modal-wrap"))return;
  if(e.key==="Escape"){if(popEl)return closePop();if(C&&$("#compose").dataset.state==="max"){$("#compose").dataset.state="normal";$(".c-scrim")&&$(".c-scrim").remove();return}if(app.classList.contains("drawer"))return app.classList.remove("drawer");if(S.checked.size){S.checked.clear();renderList();return}if(S.q&&document.activeElement.id==="q"){S.q="";renderAll();return}if(S.sel)closeMail();return}
  if((e.metaKey||e.ctrlKey)&&e.key==="Enter"&&C){e.preventDefault();sendCompose();return}
  const tg=e.target;if(tg.closest&&tg.closest("input,textarea,[contenteditable='true']"))return;if(e.metaKey||e.ctrlKey||e.altKey)return;
  const arr=viewMails();const i=arr.findIndex(m=>m.id===S.sel);
  switch(e.key){
    case "c":e.preventDefault();openCompose();break;
    case "/":e.preventDefault();const q=$("#q");if(q){q.focus();q.select()}break;
    case "?":showHelp();break;
    case "[":toggleSide();break;
    case "x":if(S.sel)closeMail();break;
    case "j":case "ArrowDown":{e.preventDefault();const n=arr[Math.min(arr.length-1,i+1)];if(n&&n.folder!=="drafts")openMail(n.id);break}
    case "k":case "ArrowUp":{e.preventDefault();const n=arr[Math.max(0,i-1)];if(n&&n.folder!=="drafts")openMail(n.id);break}
    case "e":if(S.sel){const m=byId(S.sel);m.folder==="trash"?act_restore([S.sel]):act_archive([S.sel])}break;
    case "#":case "Delete":if(S.sel){byId(S.sel).folder==="trash"?act_forever([S.sel]):act_delete([S.sel])}break;
    case "s":if(S.sel)toggleStar(S.sel);break;
    case "u":if(S.sel){byId(S.sel).unread=true;S.sel=null;app.classList.remove("reading");renderAll()}break;
    case "r":if(S.sel){e.preventDefault();reply(byId(S.sel),false)}break;
    case "f":if(S.sel){e.preventDefault();forward(byId(S.sel))}break;
  }
});

/* page-level file drop opens compose */
let pageDrag=0;
document.addEventListener("dragenter",e=>{if(!hasFiles(e)||e.target.closest&&e.target.closest("#compose"))return;pageDrag++;if(!$(".page-drop")){const d=document.createElement("div");d.className="page-drop";d.textContent=C?"Drop to attach to your message":"Drop files to start a new message";document.body.appendChild(d)}});
document.addEventListener("dragleave",e=>{if(!hasFiles(e))return;pageDrag--;if(pageDrag<=0){pageDrag=0;$(".page-drop")&&$(".page-drop").remove()}});
document.addEventListener("dragover",e=>{if(hasFiles(e))e.preventDefault()});
document.addEventListener("drop",e=>{if(!hasFiles(e))return;e.preventDefault();pageDrag=0;$(".page-drop")&&$(".page-drop").remove();addFiles(e.dataTransfer.files)});

/* ripple */
document.addEventListener("pointerdown",e=>{if(reduced)return;const b=e.target.closest(".btn,.icon-btn,.nav-item,.chip,.seg button,.mini-btn");if(!b)return;const r=b.getBoundingClientRect();const s=document.createElement("span");s.className="rip";const d=Math.max(r.width,r.height)*2.2;s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(s);setTimeout(()=>s.remove(),620)});

/* swipe rows on touch */
let swipeBlock=false;
list.addEventListener("pointerdown",e=>{if(e.pointerType!=="touch")return;const inner=e.target.closest(".row-inner");if(!inner||e.target.closest("button,label"))return;const row=inner.parentElement;const id=row.dataset.id;const m=byId(id);if(!m||m.folder==="drafts")return;
  const sx=e.clientX,sy=e.clientY;let dx=0,active=false;
  const mv=ev=>{const x=ev.clientX-sx,y=ev.clientY-sy;if(!active){if(Math.abs(x)>12&&Math.abs(x)>Math.abs(y)*1.4){active=true;row.classList.add("swiping");try{inner.setPointerCapture(ev.pointerId)}catch(_){}}else if(Math.abs(y)>10){end();return}}
    if(active){dx=x;inner.style.transform=`translateX(${dx}px)`;const bg=$(".row-bg",row);bg.style.background=dx>0?"var(--ok)":"var(--danger)";bg.style.justifyContent=dx>0?"flex-start":"flex-end";$$(".row-bg span",row).forEach((s,i)=>s.style.display=(dx>0)===(i===0)?"flex":"none");if(Math.abs(dx)>90&&!row._tick){row._tick=1;navigator.vibrate&&navigator.vibrate(8)}else if(Math.abs(dx)<=90)row._tick=0}};
  const end=()=>{inner.removeEventListener("pointermove",mv);inner.removeEventListener("pointerup",end);inner.removeEventListener("pointercancel",end);
    if(!active)return;swipeBlock=true;setTimeout(()=>swipeBlock=false,60);
    if(Math.abs(dx)>90){inner.style.transition="transform .25s var(--ease)";inner.style.transform=`translateX(${dx>0?"110%":"-110%"})`;setTimeout(()=>{dx>0?(m.folder==="trash"?act_restore([id]):act_archive([id])):(m.folder==="trash"?act_forever([id]):act_delete([id]))},200)}
    else{inner.style.transition="transform .35s var(--spring)";inner.style.transform="";setTimeout(()=>{row.classList.remove("swiping");inner.style.transition=""},350)}};
  inner.addEventListener("pointermove",mv);inner.addEventListener("pointerup",end);inner.addEventListener("pointercancel",end)});

/* theme */
function applyTheme(t){document.documentElement.dataset.theme=t;store.set("halo-theme",t);renderSidebar()}
function toggleTheme(e){const next=isDark()?"light":"dark";document.documentElement.style.setProperty("--vx",e.clientX+"px");document.documentElement.style.setProperty("--vy",e.clientY+"px");
  if(document.startViewTransition&&!reduced)document.startViewTransition(()=>applyTheme(next));else applyTheme(next)}

/* ---------- layout: resizable panes, focus modes, collapsible sidebar ---------- */
function reslide(){slide($("#nav"),$("#nav-pill"),$(".nav-item.on",side),"nav",true);slide($("#seg"),$("#seg-pill"),$("#seg button.on"),"seg-"+(S.view==="inbox"&&!S.q?"cat":"f"),false)}
function availW(){const cs=getComputedStyle(app);const inner=app.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);return inner-(app.classList.contains("side-collapsed")?76:248)-28}
function applyLayout(){const desk=innerWidth>1180;
  app.classList.toggle("list-hidden",desk&&LAY.mode==="list-hidden");app.classList.toggle("reader-hidden",desk&&LAY.mode==="reader-hidden");
  if(!desk){app.style.removeProperty("--list-w");return}
  const av=availW();const w=LAY.mode==="list-hidden"?0:LAY.mode==="reader-hidden"?av:Math.max(300,Math.min(LAY.listW,av-380));
  app.style.setProperty("--list-w",Math.round(w)+"px")}
function closeMail(){S.sel=null;app.classList.remove("reading");if(LAY.mode==="list-hidden"){LAY.mode="split";saveLay();applyLayout();setTimeout(reslide,520)}renderList();renderReader()}
function toggleSide(){if(innerWidth<=780)return;const c=app.classList.toggle("side-collapsed");store.set("halo-side",c?"1":"0");applyLayout();
  const tg=$(".side-tg",side);if(tg){tg.title=(c?"Expand":"Collapse")+" sidebar ( [ )";$("span",tg).textContent=(c?"Expand":"Collapse")+" sidebar"}
  requestAnimationFrame(()=>slide($("#nav"),$("#nav-pill"),$(".nav-item.on",side),"nav",true));setTimeout(reslide,520)}
const rz=$("#resizer");
rz.addEventListener("pointerdown",e=>{if(innerWidth<=1180||e.button!==0)return;e.preventDefault();try{rz.setPointerCapture(e.pointerId)}catch(_){}
  const startX=e.clientX;const listLeft=side.getBoundingClientRect().right+14;const av=availW();let w=null,raf=0;
  const mv=ev=>{if(w===null&&Math.abs(ev.clientX-startX)<3)return;if(w===null){app.classList.add("resizing");app.classList.remove("list-hidden","reader-hidden")}
    w=Math.max(120,Math.min(av-160,ev.clientX-listLeft-7));app.style.setProperty("--list-w",w+"px");
    app.classList.toggle("will-hide-list",w<220);app.classList.toggle("will-hide-reader",w>av-320);
    if(!raf)raf=requestAnimationFrame(()=>{raf=0;reslide()})};
  const up=()=>{rz.removeEventListener("pointermove",mv);rz.removeEventListener("pointerup",up);rz.removeEventListener("pointercancel",up);
    app.classList.remove("resizing","will-hide-list","will-hide-reader");if(w===null)return;
    if(w<220){LAY.mode="list-hidden";toast("Message list hidden. Use the list button or drag the edge to bring it back.",{icon:"panel-left-close",ms:3400})}
    else if(w>av-320){LAY.mode="reader-hidden";toast("Reading pane hidden. Open any message to bring it back.",{icon:"panel-right-close",ms:3400})}
    else{LAY.mode="split";LAY.listW=w}
    saveLay();applyLayout();renderReader();setTimeout(reslide,520)};
  rz.addEventListener("pointermove",mv);rz.addEventListener("pointerup",up);rz.addEventListener("pointercancel",up)});
rz.addEventListener("dblclick",()=>{LAY.mode="split";LAY.listW=380;saveLay();applyLayout();renderReader();setTimeout(reslide,520)});
rz.addEventListener("keydown",e=>{if(e.key!=="ArrowLeft"&&e.key!=="ArrowRight")return;e.preventDefault();LAY.mode="split";LAY.listW=Math.max(300,Math.min(availW()-380,LAY.listW+(e.key==="ArrowRight"?32:-32)));saveLay();applyLayout();setTimeout(reslide,520)});
addEventListener("resize",()=>{clearTimeout(window._rz);window._rz=setTimeout(()=>{app.classList.add("resizing");applyLayout();renderReader();reslide();requestAnimationFrame(()=>app.classList.remove("resizing"))},120)});

/* ---------- boot ---------- */
(async()=>{
  const saved=store.get("halo-theme");if(saved==="dark"||saved==="light")document.documentElement.dataset.theme=saved;
  try{await Promise.race([document.fonts.ready,wait(1200)])}catch(_){}
  seed();
  M.forEach(m=>{const v=m.starred||m.important;m.starred=v;m.important=v});
  if(store.get("halo-side")==="1"&&innerWidth>780)app.classList.add("side-collapsed");
  app.classList.add("resizing");applyLayout();
  if(innerWidth>1180&&LAY.mode!=="reader-hidden")S.sel=M[0].id,M[0].unread=false;
  renderSidebar();renderList(true);renderReader();
  requestAnimationFrame(()=>requestAnimationFrame(()=>app.classList.remove("resizing")));
  setTimeout(()=>loadPdf().then(()=>{const m=S.sel&&byId(S.sel);if(m)renderReader()}).catch(()=>{}),400);
})();
})();
</script>
